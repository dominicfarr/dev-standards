# from dominicfarr/dev-standards@<sha>
# Python hook fragment. Append this file to the end of the project's
# .pre-commit-config.yaml (its entries sit under the base `repos:`), with
# <sha> above filled in with the standards repo commit it was copied from.
# Each hook runs the project's own tools through `uv run --locked`, so the
# versions come from the project's uv.lock (add ruff, pyright and pytest to
# its dev dependency group), never from a pre-commit-managed environment.
# `language: unsupported` needs pre-commit 4.4.0 or later.
# Any hook that fails or changes files stops the commit.
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run --locked ruff check --fix
        language: unsupported
        types_or: [python, pyi]
        require_serial: true

      - id: ruff-format
        name: ruff format
        entry: uv run --locked ruff format
        language: unsupported
        types_or: [python, pyi]
        require_serial: true

      # Checks the whole project, so a change that breaks a caller elsewhere
      # is caught too.
      - id: pyright
        name: pyright
        entry: uv run --locked pyright
        language: unsupported
        types_or: [python, pyi]
        pass_filenames: false

      # A fast full run, stopping at the first failure. If the suite grows
      # slow, add pytest-testmon to the dev group and append `--testmon` to
      # run only the tests related to the change. pytest exits 5 when it
      # collects no tests, which passes here so a project with no tests yet
      # can still commit; any other failure stops the commit.
      - id: pytest
        name: pytest
        entry: >-
          bash -c 'uv run --locked pytest -x -q || { code=$?;
          [ "$code" -eq 5 ] || exit "$code"; }'
        language: unsupported
        types_or: [python, pyi]
        pass_filenames: false
