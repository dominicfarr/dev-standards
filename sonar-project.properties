# from dominicfarr/dev-standards@a692b4b1344bdfee10ecd5595d2134815882dc27
# Base SonarQube Cloud properties. Copy to the project root as
# sonar-project.properties when the "Add Sonar" ticket is worked
# (docs/DEVELOPMENT.md, Sonar). Replace <repo>, and fill the two marked
# extension points.

sonar.projectKey=dominicfarr_dev-standards
sonar.organization=dominicfarr

# What projects copy and run: the gate-proof script, the workflows, the
# templates and the hook fragments. The docs are not sources.
sonar.sources=scripts,.github,templates,hooks
# The gate-proof fixtures are scratch projects and lockfiles that the script
# builds throwaway repos from, not code of this repo.
sonar.exclusions=scripts/fixtures/**
# No tests, so no sonar.tests.

# --- EXTENSION POINT: coverage report path ---------------------------------
# No tests, so no report path.
# --- END OF EXTENSION POINT ------------------------------------------------

# --- EXTENSION POINT: coverage exclusions ----------------------------------
# No tests: exclude everything, so there is nothing to cover and the gate's
# coverage condition can't fail.
sonar.coverage.exclusions=**/*
# --- END OF EXTENSION POINT ------------------------------------------------

# Fail the workflow run when the quality gate fails.
sonar.qualitygate.wait=true
