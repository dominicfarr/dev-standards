# from dominicfarr/dev-standards@<sha>
# Base SonarQube Cloud properties. Copy to the project root as
# sonar-project.properties when the "Add Sonar" ticket is worked
# (docs/DEVELOPMENT.md, Sonar). Replace <repo>, and fill the two marked
# extension points.

sonar.projectKey=dominicfarr_<repo>
sonar.organization=dominicfarr

# Adjust to the project's layout. Include .github so the workflows are
# analysed too.
sonar.sources=src,.github
sonar.tests=tests
# A repo with no tests drops sonar.tests: the scan fails on a folder that
# doesn't exist.
# Co-located tests (beside the code, e.g. **/*.test.ts) overlap the sources,
# and a file can't be indexed twice: set sonar.tests to the source folder,
# match the tests with sonar.test.inclusions, and also list them in
# sonar.exclusions.
#sonar.test.inclusions=**/*.test.ts
#sonar.exclusions=**/*.test.ts

# --- EXTENSION POINT: coverage report path ---------------------------------
# The report the workflow's test step writes, for example:
#   JS/TS:  sonar.javascript.lcov.reportPaths=coverage/lcov.info
#   Python: sonar.python.coverage.reportPaths=coverage.xml
# A repo with no tests sets no report path.
# --- END OF EXTENSION POINT ------------------------------------------------

# --- EXTENSION POINT: coverage exclusions ----------------------------------
# Keep this list in step with the test tool's own coverage excludes (Vitest
# coverage.exclude, coverage.py omit), and say why each entry is excluded.
# A repo with no tests excludes everything, which tells Sonar there is
# nothing to cover, so the gate's coverage condition can't fail:
#   sonar.coverage.exclusions=**/*
#sonar.coverage.exclusions=
# --- END OF EXTENSION POINT ------------------------------------------------

# Fail the workflow run when the quality gate fails.
sonar.qualitygate.wait=true
